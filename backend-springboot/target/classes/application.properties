spring.application.name=texhive-backend

# Render provides PORT automatically.
# Locally, it will use 8080.
server.port=${PORT:8080}


# ==============================
# DATABASE - Layerbase MariaDB
# ==============================

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED&serverTimezone=UTC&allowPublicKeyRetrieval=true&connectTimeout=30000&socketTimeout=60000
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


# ==============================
# JPA / HIBERNATE
# ==============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# ==============================
# SQL INITIALIZATION
# ==============================

spring.sql.init.mode=always
spring.sql.init.continue-on-error=false