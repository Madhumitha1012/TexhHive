<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login | TexHive</title>

    <link rel="stylesheet" href="css/style.css">
</head>


<body class="auth-page">

    <div class="auth-card">

        <a class="logo" href="index.html">
            TEX<span>HIVE</span>
        </a>

        <p class="eyebrow">
            WELCOME BACK
        </p>

        <h1>
            Sign in to TexHive
        </h1>


        <form id="loginForm">

            <label>
                Email

                <input
                    type="email"
                    id="email"
                    required
                >
            </label>


            <label>
                Password

                <input
                    type="password"
                    id="password"
                    required
                >
            </label>


            <button class="primary full">
                LOGIN
            </button>

        </form>


        <p id="message" class="message"></p>


        <p class="small">
            New to TexHive?
            <a href="register.html">
                Create an account
            </a>
        </p>

    </div>


    <script src="js/api.js"></script><script src="js/core.js"></script><script src="js/auth.js"></script>

</body>

</html>
