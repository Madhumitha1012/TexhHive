<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Products | TexHive</title><link rel="stylesheet" href="css/style.css"></head><body onload="initSupplier()"><header class="nav"><a class="logo" href="supplier-dashboard.html">TEX<span>HIVE</span></a><div><a class="ghost" href="supplier-dashboard.html">Dashboard</a><button class="ghost" onclick="logout()">Logout</button></div></header><main class="page"><div class="page-head"><div><p class="eyebrow">SUPPLIER WORKSPACE</p><h1>My Products</h1><p class="muted">Add textile products using the TexHive product catalog or choose Other for a custom listing.</p></div></div><form id="productForm" class="card form-grid"><label>Product image<input id="imageFile" type="file" accept="image/*"><small class="muted">Optional. A local image preview is saved with this demo product.</small></label><label>Product name<select id="nameSelect" required></select><input id="customName" placeholder="Enter custom product name" style="display:none;margin-top:8px"></label><label>Category<select id="categorySelect" required></select><input id="customCategory" placeholder="Enter custom category" style="display:none;margin-top:8px"></label><label>Material / Fibre<input id="material" placeholder="e.g. 100% Cotton"></label><label>Product type<input id="type" placeholder="e.g. Woven Fabric"></label><label>Price<input id="price" type="number" min="0" required></label><label>Unit<select id="unit" required><option>meter</option><option>kg</option><option>piece</option><option>yard</option></select></label><label>MOQ<input id="moq" type="number" min="1" required></label><label>Available quantity<input id="availableQty" type="number" min="0" required></label><label>Location<input id="location" required></label><label>Color<input id="color"></label><label>GSM<input id="gsm"></label><label>Width<input id="width"></label><label>Weave / Construction<input id="weave"></label><label>Finish<input id="finish"></label><label class="fullrow">Description<textarea id="description"></textarea></label><div id="imagePreview" class="image-preview fullrow" style="display:none"></div><div class="fullrow product-form-actions"><button id="productSubmit" class="primary" type="submit">ADD PRODUCT</button><button id="productCancel" class="ghost" type="button" onclick="cancelEdit()" style="display:none">CANCEL EDIT</button></div><p id="productMsg" class="message fullrow"></p></form><div class="panel-title" style="margin-top:26px"><h2>My Product Catalog</h2><span class="muted" id="productCount"></span></div><div id="mine" class="grid" style="margin-top:12px"></div></main><script src="js/api.js"></script><script src="js/core.js"></script><script src="js/demo-data.js"></script><script>
let editingProductId=null, currentImage='';
const catalog=typeof TEXHIVE_PRODUCT_CATALOG!=='undefined'?TEXHIVE_PRODUCT_CATALOG:[];

async function initSupplier(){
    if(!ensureUser()) return;
    if(user().role!=='SUPPLIER'){location.href='dashboard.html';return;}
    nav();
    setupOptions();
    document.getElementById('imageFile').onchange=previewImage;
    document.getElementById('productForm').onsubmit=submitProduct;
    await renderMine();
}

function setupOptions(){
    const ns=document.getElementById('nameSelect'),cs=document.getElementById('categorySelect');
    ns.innerHTML=catalog.map(p=>`<option value="${escapeHtml(p.name)}">${escapeHtml(p.name)}</option>`).join('')+'<option value="Other">Other</option>';
    cs.innerHTML=[...new Set(catalog.map(p=>p.category))].map(c=>`<option>${escapeHtml(c)}</option>`).join('')+'<option value="Other">Other</option>';
    ns.onchange=fillFromCatalog;
    cs.onchange=()=>document.getElementById('customCategory').style.display=cs.value==='Other'?'block':'none';
    fillFromCatalog();
}
function fillFromCatalog(){
    const name=document.getElementById('nameSelect').value,p=catalog.find(x=>x.name===name);
    const custom=document.getElementById('customName');
    custom.style.display=name==='Other'?'block':'none';
    if(!p)return;
    document.getElementById('categorySelect').value=p.category;
    document.getElementById('customCategory').style.display='none';
    for(const [idv,key] of [['material','material'],['type','type'],['price','price'],['unit','unit'],['moq','moq'],['availableQty','availableQty'],['location','location'],['color','color'],['gsm','gsm'],['width','width'],['weave','weave'],['finish','finish']]){
        const el=document.getElementById(idv); if(el) el.value=p[key]??'';
    }
    document.getElementById('description').value=`${p.name} supplied through TexHive textile marketplace.`;
    currentImage=p.image||'';showImage(currentImage);
}
function previewImage(e){const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{currentImage=reader.result;showImage(currentImage)};reader.readAsDataURL(f);}
function showImage(src){const box=document.getElementById('imagePreview');if(!src){box.style.display='none';return;}box.style.display='block';box.innerHTML=`<img src="${escapeHtml(src)}" alt="Product preview">`;}

async function submitProduct(e){
    e.preventDefault();
    const nameSel=document.getElementById('nameSelect').value,catSel=document.getElementById('categorySelect').value;
    const formData={
        name:nameSel==='Other'?document.getElementById('customName').value.trim():nameSel,
        category:catSel==='Other'?document.getElementById('customCategory').value.trim():catSel,
        material:document.getElementById('material').value.trim(),type:document.getElementById('type').value.trim(),
        price:+document.getElementById('price').value,unit:document.getElementById('unit').value,moq:+document.getElementById('moq').value,
        availableQty:+document.getElementById('availableQty').value,location:document.getElementById('location').value.trim(),
        color:document.getElementById('color').value.trim(),gsm:document.getElementById('gsm').value.trim(),
        width:document.getElementById('width').value.trim(),weave:document.getElementById('weave').value.trim(),
        finish:document.getElementById('finish').value.trim(),description:document.getElementById('description').value.trim(),
        image:currentImage||'images/products/premium-cotton.svg',supplierId:String(user().id)
    };
    if(!formData.name||!formData.category){productMsg.textContent='Please select or enter product name and category.';return;}
    try{
        if(editingProductId){
            await apiPut('/products/'+encodeURIComponent(editingProductId),formData);
            productMsg.textContent='Product updated successfully.';
            cancelEdit(false);
        }else{
            await apiPost('/products',{id:'PROD-'+Date.now(),...formData,status:user().status==='ACTIVE'?'ACTIVE':'PENDING'});
            productMsg.textContent='Product added successfully.';
        }
        await renderMine();
    }catch(err){productMsg.textContent=err.message||'Unable to save product.';}
}
async function editProduct(pid){
    const p=(await apiGet('/products/supplier/'+encodeURIComponent(user().id))).find(x=>String(x.id)===String(pid));
    if(!p)return;
    editingProductId=p.id;
    const match=catalog.find(x=>x.name===p.name);
    document.getElementById('nameSelect').value=match?p.name:'Other';
    document.getElementById('customName').value=match?'':p.name;
    document.getElementById('customName').style.display=match?'none':'block';
    const cats=[...new Set(catalog.map(x=>x.category))];
    document.getElementById('categorySelect').value=cats.includes(p.category)?p.category:'Other';
    document.getElementById('customCategory').value=cats.includes(p.category)?'':p.category;
    document.getElementById('customCategory').style.display=document.getElementById('categorySelect').value==='Other'?'block':'none';
    for(const idv of ['material','type','price','unit','moq','availableQty','location','color','gsm','width','weave','finish','description'])document.getElementById(idv).value=p[idv]??'';
    currentImage=p.image||'';showImage(currentImage);productSubmit.textContent='UPDATE PRODUCT';productCancel.style.display='inline-block';window.scrollTo({top:0,behavior:'smooth'});
}
function cancelEdit(clear=true){editingProductId=null;document.getElementById('productForm').reset();document.getElementById('productSubmit').textContent='ADD PRODUCT';document.getElementById('productCancel').style.display='none';currentImage='';setupOptions();if(clear)productMsg.textContent='';document.getElementById('imagePreview').style.display='none';}
async function renderMine(){
    const a=await apiGet('/products/supplier/'+encodeURIComponent(user().id));
    productCount.textContent=`${a.length} products`;
    mine.innerHTML=a.length?a.slice().map(p=>`<article class="product-card product-card-image"><img class="product-image" src="${escapeHtml(p.image||'images/products/premium-cotton.svg')}" alt="${escapeHtml(p.name)}"><div class="panel-title"><h3>${escapeHtml(p.name)}</h3><span class="badge ${p.status==='ACTIVE'?'good':'warn'}">${escapeHtml(p.status||'PENDING')}</span></div><div class="price">₹${Number(p.price||0)}/${escapeHtml(p.unit||'')}</div><div class="meta">Product ID: ${escapeHtml(p.id)}<br>Category: ${escapeHtml(p.category||'')}<br>MOQ: ${Number(p.moq||0)} ${escapeHtml(p.unit||'')}<br>Stock: ${Number(p.availableQty||0)} ${escapeHtml(p.unit||'')}</div><div class="actions"><button type="button" class="ghost" onclick="editProduct(${JSON.stringify(p.id)})">UPDATE</button></div></article>`).join(''):'<div class="empty">No products yet. Add your first textile product above.</div>';
}
</script><script src="js/sidebar.js"></script></body></html>
