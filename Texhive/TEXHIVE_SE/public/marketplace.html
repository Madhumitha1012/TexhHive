<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Textile Marketplace | TexHive</title>

    <link rel="stylesheet" href="css/style.css">
</head>


<body onload="initMarket()">

    <header class="nav">

        <a class="logo" href="dashboard.html">
            TEX<span>HIVE</span>
        </a>

        <div>

            <a class="ghost" href="dashboard.html">
                Dashboard
            </a>

            <button class="ghost" onclick="logout()">
                Logout
            </button>

        </div>

    </header>


    <main class="page">

        <div class="page-head">

            <div>

                <p class="eyebrow">
                    BUYER
                </p>

                <h1>
                    Textile Marketplace
                </h1>

                <p class="muted">
                    Discover supplier-listed textile products.
                </p>

            </div>

        </div>


        <div
            class="panel"
            style="margin-bottom: 20px"
        >

            <input
                id="search"
                placeholder="Search cotton, yarn, denim..."
                oninput="renderProducts()"
            >

        </div>


        <div
            id="products"
            class="grid"
        ></div>

    </main>


    <script src="js/api.js"></script><script src="js/core.js"></script>
    <script src="js/marketplace.js"></script>

<script src="js/sidebar.js"></script>
</body>

</html>
