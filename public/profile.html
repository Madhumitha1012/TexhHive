<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Profile | TexHive</title>

    <link rel="stylesheet" href="css/style.css">
</head>


<body onload="initProfile()">

    <header class="nav">

        <a class="logo" href="dashboard.html">
            TEX<span>HIVE</span>
        </a>

        <button
            class="ghost"
            onclick="logout()"
        >
            Logout
        </button>

    </header>


    <main class="page">

        <div class="page-head">

            <div>

                <p class="eyebrow">
                    ACCOUNT
                </p>

                <h1>
                    Profile
                </h1>

            </div>

        </div>


        <form
            id="profile"
            class="card form-grid"
        >

            <label>
                Name

                <input id="name">
            </label>


            <label>
                Company

                <input id="company">
            </label>


            <label>
                Email

                <input
                    id="email"
                    disabled
                >
            </label>


            <label>
                Phone

                <input id="phone">
            </label>


            <label>
                Address

                <input id="address">
            </label>


            <label>
                Role

                <input
                    id="role"
                    disabled
                >
            </label>


            <div class="fullrow profile-actions">
                <button class="primary" type="submit">
                    UPDATE PROFILE
                </button>
                <button class="ghost" type="button" onclick="loadProfileValues()">
                    RESET CHANGES
                </button>
            </div>


            <p
                id="msg"
                class="message fullrow"
            ></p>

        </form>

    </main>


    <script src="js/api.js"></script><script src="js/core.js"></script>


    <script>
async function loadProfileValues(){
    const u=user();if(!u)return;
    document.getElementById('name').value=u.name||'';
    document.getElementById('company').value=u.companyName||'';
    document.getElementById('email').value=u.email||'';
    document.getElementById('phone').value=u.phone||'';
    document.getElementById('address').value=u.address||'';
    document.getElementById('role').value=u.role||'';
}
async function initProfile(){
    if(!ensureUser())return;
    nav();await loadProfileValues();
    document.getElementById('profile').onsubmit=async e=>{
        e.preventDefault();
        if(user().role==='ADMIN'){
            document.getElementById('msg').textContent='Admin profile is predefined for the project.';
            return;
        }
        try{
            const updated=await apiPut('/users/'+encodeURIComponent(user().id),{
                name:document.getElementById('name').value.trim(),
                companyName:document.getElementById('company').value.trim(),
                phone:document.getElementById('phone').value.trim(),
                address:document.getElementById('address').value.trim()
            });
            setUser({...user(),...updated});
            document.getElementById('msg').textContent='Profile updated successfully in MySQL.';
            nav();
        }catch(err){document.getElementById('msg').textContent=err.message||'Unable to update profile.';}
    };
}
</script>

<script src="js/sidebar.js"></script>
</body>

</html>
