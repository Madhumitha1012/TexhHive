<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders | TexHive</title><link rel="stylesheet" href="css/style.css"></head><body onload="initOrders()"><header class="nav"><a class="logo" href="dashboard.html">TEX<span>HIVE</span></a><a class="ghost" href="dashboard.html">Dashboard</a></header><main class="page"><div class="page-head"><div><p class="eyebrow">BUYER WORKSPACE</p><h1>My Orders</h1><p class="muted">View order details and download a complete TexHive order report.</p></div></div><section class="panel"><div id="orders"></div></section></main><script src="js/api.js"></script><script src="js/core.js"></script><script>
async function initOrders(){
    if(!ensureUser())return;
    if(user().role!=='BUYER'){location.href=user().role==='SUPPLIER'?'supplier-orders.html':'admin.html';return;}
    nav(); await renderOrders();
}
async function renderOrders(){
    const os=await apiGet('/orders/buyer/'+encodeURIComponent(user().id));
    const box=document.getElementById('orders');
    box.innerHTML=os.length?os.map(o=>`<article class="order-card"><div class="panel-title"><div><span class="badge good">${escapeHtml(o.status||'CONFIRMED')}</span><h2>Order #${escapeHtml(o.id)}</h2></div><button class="primary" type="button" onclick='downloadOrderReport(${JSON.stringify(o)})'>DOWNLOAD ORDER REPORT</button></div><div class="order-grid"><div><small>PRODUCT</small><b>${escapeHtml(o.productName)}</b><span>Product ID: ${escapeHtml(o.productId)}</span></div><div><small>QUANTITY / MOQ</small><b>${escapeHtml(o.quantity)} ${escapeHtml(o.unit)}</b><span>MOQ: ${escapeHtml(o.moq||'—')}</span></div><div><small>SUPPLIER</small><b>${escapeHtml(o.supplierCompany||o.supplierName||'Supplier')}</b><span>Supplier ID: ${escapeHtml(o.supplierId)}</span></div><div><small>DELIVERY</small><b>${escapeHtml(o.expectedDate||'—')}</b><span>${escapeHtml(o.deliveryDays||'—')} days · ${escapeHtml(o.deliveryLocation||'—')}</span></div><div><small>QUOTATION</small><b>#${escapeHtml(o.quotationId||'—')}</b><span>₹${escapeHtml(o.unitPrice||0)}/${escapeHtml(o.unit||'')}</span></div><div><small>TOTAL</small><b>₹${escapeHtml(o.totalAmount||0)}</b><span>${escapeHtml(o.paymentTerms||'Payment terms —')}</span></div></div><div class="counterparty"><b>Supplier:</b> ${escapeHtml(o.supplierName||'—')} · ${escapeHtml(o.supplierCompany||'—')} · ID ${escapeHtml(o.supplierId||'—')}</div></article>`).join(''):'<div class="empty">No orders yet.</div>';
}
</script><script src="js/sidebar.js"></script></body></html>
