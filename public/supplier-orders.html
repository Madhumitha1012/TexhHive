<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Supplier Orders | TexHive</title><link rel="stylesheet" href="css/style.css"></head><body onload="init()"><header class="nav"><a class="logo" href="supplier-dashboard.html">TEX<span>HIVE</span></a><div><a class="ghost" href="supplier-dashboard.html">Dashboard</a><button class="ghost" onclick="logout()">Logout</button></div></header><main class="page"><div class="page-head"><div><p class="eyebrow">SUPPLIER WORKSPACE</p><h1>My Orders</h1><p class="muted">Manage buyer orders and download complete order reports.</p></div></div><section class="panel"><div id="orders"></div></section></main><script src="js/api.js"></script><script src="js/core.js"></script><script>
async function init(){if(!ensureUser())return;if(user().role!=='SUPPLIER'){location.href='dashboard.html';return;}nav();await render();}
async function update(idv,status){try{await apiPatch('/orders/'+encodeURIComponent(idv)+'/status',{status});await render();}catch(e){alert(e.message||'Unable to update order.');}}
async function render(){
    const a=await apiGet('/orders/supplier/'+encodeURIComponent(user().id));
    orders.innerHTML=a.length?a.map(o=>{let action=o.status==='CONFIRMED'?`<button class="primary" type="button" onclick="update('${o.id}','PROCESSING')">START PROCESSING</button>`:o.status==='PROCESSING'?`<button class="primary" type="button" onclick="update('${o.id}','COMPLETED')">COMPLETE ORDER</button>`:`<span class="badge good">${escapeHtml(o.status)}</span>`;return `<article class="order-card"><div class="panel-title"><div><span class="badge">${escapeHtml(o.status||'CONFIRMED')}</span><h2>Order #${escapeHtml(o.id)}</h2></div><div>${action}<button class="ghost" type="button" onclick='downloadOrderReport(${JSON.stringify(o)})'>DOWNLOAD REPORT</button></div></div><div class="order-grid"><div><small>PRODUCT</small><b>${escapeHtml(o.productName)}</b><span>Product ID: ${escapeHtml(o.productId)}</span></div><div><small>QUANTITY / MOQ</small><b>${escapeHtml(o.quantity)} ${escapeHtml(o.unit)}</b><span>MOQ: ${escapeHtml(o.moq||'—')}</span></div><div><small>BUYER</small><b>${escapeHtml(o.buyerCompany||'Buyer')}</b><span>Buyer ID: ${escapeHtml(o.buyerId)}</span></div><div><small>DELIVERY</small><b>${escapeHtml(o.expectedDate||'—')}</b><span>${escapeHtml(o.deliveryDays||'—')} days · ${escapeHtml(o.deliveryLocation||'—')}</span></div><div><small>QUOTATION</small><b>#${escapeHtml(o.quotationId||'—')}</b><span>₹${escapeHtml(o.unitPrice||0)}/${escapeHtml(o.unit||'')}</span></div><div><small>TOTAL</small><b>₹${escapeHtml(o.totalAmount||0)}</b><span>${escapeHtml(o.paymentTerms||'Payment terms —')}</span></div></div><div class="counterparty"><b>Buyer:</b> ${escapeHtml(o.buyerName||'—')} · ${escapeHtml(o.buyerCompany||'—')} · ID ${escapeHtml(o.buyerId||'—')} · ${escapeHtml(o.buyerPhone||'—')}</div></article>`}).join(''):'<div class="empty">No supplier orders yet.<br>Orders appear after a buyer accepts your quotation.</div>';
}
</script><script src="js/sidebar.js"></script></body></html>
