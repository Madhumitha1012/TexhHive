<!doctype html>
<html>

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1"
    >

    <title>Buyer RFQs | TexHive</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body onload="init()">

    <header class="nav">

        <a
            class="logo"
            href="supplier-dashboard.html"
        >
            TEX<span>HIVE</span>
        </a>

        <div>

            <a
                class="ghost"
                href="supplier-dashboard.html"
            >
                Dashboard
            </a>

            <button
                class="ghost"
                onclick="logout()"
            >
                Logout
            </button>

        </div>

    </header>


    <main class="page">

        <div class="page-head">

            <div>

                <p class="eyebrow">
                    SUPPLIER WORKSPACE
                </p>

                <h1>
                    Buyer RFQs
                </h1>

                <p class="muted">
                    Review buyer requests and send quotations.
                </p>

            </div>

        </div>


        <section class="panel">

            <div id="list"></div>

        </section>

    </main>


    <script src="js/api.js"></script><script src="js/core.js"></script>

    <script>
async function init(){
    if(!ensureUser())return;
    if(user().role!=='SUPPLIER'){location.href='dashboard.html';return;}
    nav();
    try{
        const a=await apiGet('/rfqs/supplier/'+encodeURIComponent(user().id));
        list.innerHTML=a.length?a.map(r=>`<div class="activity-row"><span><b>${escapeHtml(r.productName)}</b><br><small class="muted">${escapeHtml(r.quantity)} ${escapeHtml(r.unit)} · Delivery ${escapeHtml(r.requiredDeliveryDate||'—')} · ${escapeHtml(r.deliveryLocation||'—')}</small></span><span>${r.status==='PENDING'?`<a class="primary" href="supplier-quotations.html?rfqId=${encodeURIComponent(r.id)}">SEND QUOTATION</a>`:`<span class="badge good">${escapeHtml(r.status)}</span>`}</span></div>`).join(''):'<div class="empty">No buyer RFQs yet.</div>';
    }catch(e){list.innerHTML='<div class="empty">Unable to load RFQs.</div>';}
}
</script>

<script src="js/sidebar.js"></script>
</body>

</html>
